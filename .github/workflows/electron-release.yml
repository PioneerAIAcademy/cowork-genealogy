# Builds the Research Viewer (apps/electron) for macOS and Windows and, on every
# push to main, publishes the two installers to the `cowork-latest` release that
# cowork-release.yml fills with the MCP server and plugin. README.md links to
# them by fixed name, so the links never change and always serve main.
#
# A separate workflow, not a job in cowork-release.yml, so a broken viewer build
# never holds back the MCP server and plugin. Pull requests that touch the viewer
# build both installers without publishing, so a packaging break shows on the PR
# rather than as a download that silently stops updating. Run it by hand
# (workflow_dispatch) on any branch for the same dry run; the installers are
# attached to the run as artifacts.
#
# UNSIGNED: the installers are not code-signed or notarized, so testers clear
# Gatekeeper/SmartScreen by hand (README.md, "Install"). Adding signing:
# apps/electron/README.md. CSC_IDENTITY_AUTO_DISCOVERY=false forces the unsigned
# build instead of picking up a stray certificate.
#
# No Linux build: the viewer runs beside Claude Desktop, which has none.
# `pnpm build:linux` still packages one locally.

name: Electron release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/electron/**'
      - 'packages/viewer-ui/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/electron-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # replace the release's files

# One publish at a time on main, in push order; a newer PR push cancels the older.
concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAG: cowork-latest
  ASSETS: research-viewer-mac.dmg research-viewer-windows-setup.exe

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            asset: research-viewer-mac.dmg
          - os: windows-latest
            target: win
            asset: research-viewer-windows-setup.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v7

      # pnpm BEFORE setup-node so the cache step can find it. Version is read
      # from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      # apps/electron depends on workspace:* packages (schema, viewer-ui), so
      # install the whole workspace from the repo root, not just the app.
      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # `pnpm build` bakes `<version>+<date>.<sha>` from this checkout into the
      # main process (src/main/build-info.ts), so a feedback bundle's
      # viewer_version names the commit (#2126).
      - name: Build & package
        working-directory: apps/electron
        run: pnpm build && pnpm exec electron-builder --${{ matrix.target }} --publish never

      # electron-builder logs a dependency it could not resolve at WARN, so a
      # packaged app carrying none of its dependencies is a green build that
      # opens no window (#1070). Publishing needs this job, so this blocks it.
      - name: Verify the packaged app has its dependencies
        working-directory: apps/electron
        run: npm run check-packaged

      # `!cancelled()` so a failed verify still hands you the installer to
      # inspect; `warn` so a build that never produced one reports the build
      # error, not a second error about the missing file.
      - name: Upload the installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: apps/electron/dist/${{ matrix.asset }}
          if-no-files-found: warn

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the cowork-latest release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        # $ASSETS unquoted on purpose: it is two paths.
        run: gh release upload "$TAG" $ASSETS --clobber --repo "$GITHUB_REPOSITORY"
