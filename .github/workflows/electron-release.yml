# Electron desktop app (Research Viewer) — alpha release pipeline.
#
# UNSIGNED alpha: mac/win builds are not code-signed or notarized (see the
# "Adding code signing later" runbook in apps/electron/README.md). Testers must
# clear Gatekeeper/SmartScreen by hand — the README documents the exact steps.
#
# Two ways in:
#   - push a tag `electron-v1.2.3`  → builds + PUBLISHES a GitHub Release.
#   - run manually (workflow_dispatch) → builds the full matrix with
#     `--publish never` and uploads the artifacts. This is the DRY RUN: use it
#     to prove the pipeline before cutting a real tag.
#
# Trigger is namespaced `electron-v*` (NOT the generic `v*.*.*`) so a future
# .mcpb/plugin release tag in this monorepo never accidentally fires an
# electron build.

name: Electron release

on:
  push:
    tags:
      - 'electron-v*'
  workflow_dispatch: {}

permissions:
  contents: write   # create the GitHub Release + upload assets on a tag push

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # pnpm BEFORE setup-node so the npm-cache step can find it. Version is read
      # from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      # apps/electron depends on workspace:* packages (schema, viewer-ui), so
      # install the whole workspace from the repo root, not just the app.
      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # `--publish always` only on a real tag push; the manual dry run builds the
      # same artifacts but publishes nothing. CSC_IDENTITY_AUTO_DISCOVERY=false
      # forces a clean unsigned (ad-hoc) build instead of picking up a stray cert.
      - name: Build & package (mac, unsigned)
        if: matrix.target == 'mac'
        working-directory: apps/electron
        run: pnpm build && pnpm exec electron-builder --mac --arm64 --x64 --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build & package (win, unsigned)
        if: matrix.target == 'win'
        working-directory: apps/electron
        run: pnpm build && pnpm exec electron-builder --win --x64 --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & package (linux)
        if: matrix.target == 'linux'
        working-directory: apps/electron
        run: pnpm build && pnpm exec electron-builder --linux AppImage --x64 --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gate this workflow was missing (#1070). electron-builder logs a
      # dependency it could not resolve at WARN, so a packaged app carrying none
      # of its declared dependencies is a GREEN build that opens no window and
      # prints nothing.
      #
      # No per-OS asar path: the script finds every app.asar under dist/ itself,
      # which also covers mac emitting one per architecture, and hard-fails when
      # it finds none rather than passing on an empty search.
      #
      # **What this does and does not stop on a tag push.** The packaging steps
      # above carry `--publish always`, so assets are uploaded BEFORE this runs
      # and this step cannot prevent the upload. electron-publish creates a
      # **draft** release by default (`gitHubPublisher.js`), so nothing becomes
      # public on its own: a red leg here is the signal not to publish that
      # draft, and with `fail-fast: false` the other OS legs still upload theirs.
      # Splitting packaging from publishing would make this a true gate; that is
      # a change to a release path nothing has ever exercised end to end, so it
      # is deliberately not bundled with this fix.
      - name: Verify the packaged app has its dependencies
        working-directory: apps/electron
        run: npm run check-packaged

      # Keep the dry-run output so you can download + smoke-test installers
      # straight off the Actions run (only on manual dispatch; tag pushes publish
      # to the Release instead).
      # `!cancelled()` so a FAILED verify still uploads: a broken artifact is
      # exactly the one worth downloading and inspecting, and the default
      # `success()` would withhold it precisely then. Not `always()` — that fires
      # on cancellation too, and with `if-no-files-found: error` a cancelled run
      # would report a spurious upload failure on top of the cancellation.
      - name: Upload dry-run artifacts
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-dist
          path: apps/electron/dist/**
          # `warn`, not `error`. This step now runs on failure too (so a failed
          # verify still hands you the artifact to inspect), and the common
          # failure is the BUILD failing before dist/ exists at all — where
          # `error` would add a second red step blaming a missing artifact
          # instead of the typecheck error that actually broke it.
          if-no-files-found: warn
