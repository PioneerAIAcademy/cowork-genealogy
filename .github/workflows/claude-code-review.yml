name: Claude Code Review

# Runs Anthropic's `code-review` plugin against each PR and posts confirmed
# findings as inline comments. Generated by `/install-github-app` (#1204), then
# tuned here for cost and noise.
#
# The plugin prompt is high-signal by design: compile/parse failures, clear
# logic errors, and unambiguous CLAUDE.md violations, each validated by a
# subagent before posting. Style, pre-existing issues, and anything a linter
# already catches are dropped. `actions/checkout` matters because CLAUDE.md is
# what teaches it this repo's rules.
#
# ⚠️ A GREEN RUN DOES NOT MEAN A REVIEW HAPPENED. The action refuses to run when
# this file differs from the copy on the default branch — a guard against a PR
# editing the reviewer to exfiltrate secrets — and it exits *success* when it
# skips. So any PR that touches this file gets a green check and no review, and
# changes here are only in force once merged. To confirm a real run, look for
# "Workflow validation failed" in the log; if it is there, nothing was reviewed.
#
# Advisory only. Never make this a required check: a review that errors or times
# out would block every merge, and its findings are claims to verify, not
# verdicts (docs/task-lifecycle.md § "Reviewing someone else's PR").

on:
  pull_request:
    # `synchronize` is deliberately absent — it would run a paid review on every
    # push to every PR. `ready_for_review` still catches the moment an author
    # asks for eyes, which is the point at which a review is worth buying.
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  # The action mints an OIDC token and exchanges it for the Claude GitHub App's
  # installation token — that app token is what posts comments, which is why
  # `pull-requests: read` is enough here. Without `id-token: write` the run fails
  # before reaching Claude with "Could not fetch an OIDC token".
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Bills against the Claude subscription seat this token belongs to,
          # not API credits. Swap to `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
          # to move CI spend onto the API bill instead — that secret is set.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --append-system-prompt "The PR description has a 'Review guidance' section with the author's 'Start here' and 'Unsure about' notes. Weight your review toward what it names. This does not limit scope — still report anything else you find, and do not treat an empty or missing section as a reason to review less."
