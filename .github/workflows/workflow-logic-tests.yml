name: workflow-logic-tests

# Runs the pure-logic tests for the repo-governance files that route work:
# which board column a card lands in.
#
# WHY. project-status-sync.yml decides something where a wrong answer is still a
# VALID answer, so nothing downstream complains: it picks a column, and a wrong
# column is still a column. The run goes green, the board is quietly wrong, and
# the only detector is a human noticing weeks later. Nothing else in CI reads the
# file — the JS suite (`make test-js`) covers web, electron, viewer-ui and
# schema, and a workflow branch table belongs in none of those packages.
#
# WHAT THIS DOES NOT COVER. Only the pure decision functions. A green run here
# says nothing about whether the App token can still write the board, whether
# the column names still exist on the live project, or whether the workflow wins
# its race with the built-in "Item closed" automation. Those are only observable
# from a live run — see the ORDERING note in project-status-sync.yml. Do not
# read this job as end-to-end coverage of the board automation.
#
# No install step and no dependencies on purpose: the test extracts the script
# block from the raw YAML itself, so this job is `checkout` + `node`.

on:
  pull_request:
    paths: &paths
      - '.github/workflows/project-status-sync.yml'
      - '.github/workflows/check-runlogs.yml'
      - '.github/workflows/workflow-logic-tests.yml'
      - '.github/tests/**'
      - 'scripts/claude-hooks/**'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    name: project-status-sync routing table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node .github/tests/project-status-sync-routing.test.mjs

  # Same class as the one above: the issue-filing gate decides something where
  # a wrong answer is a valid-looking one. It fails open by design, so a broken
  # regex stops the prompt without stopping anything else — the filing goes
  # through ungated and the run is green. Its test proved this from a clean
  # checkout and nothing ever ran it.
  issue-gate:
    name: gate-issue-create hook fires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/claude-hooks/test-gate-issue-create.py

  check-runlogs-post-gate:
    name: check-runlogs post-gate lints carry !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node .github/tests/check-runlogs-post-gate-lints.test.mjs
