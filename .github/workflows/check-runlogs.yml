name: Check runlog discipline

# Enforces the per-PR runlog contract per docs/plan/eval-runlog-versioning.md §C6:
#
#   Rule 1 (blocking): At most one newly-added-or-renamed-into-place
#   v{N}.json (released) per eval/runlogs/unit/<skill>/ per PR.
#
#   Rule 2 (blocking): The latest full-skill run log per touched skill
#   must be "active on skill-side files" — its embedded snapshot matches
#   the current PR-branch state of all snapshot-tracked files.
#
#   Rule 2b (warn-only): The same run log's judge_prompt_hash matches the
#   current eval/harness/judge/prompt.md. Mismatch surfaces a warning
#   annotation but does not block merge — judge-prompt edits are a
#   separate project-wide cadence.
#
#   Rule 3 (blocking): The latest full-skill run log's .ann.json contains
#   a correction entry for every (test_id, dimension_source, dimension_name)
#   triple present in the run log.
#
# Scratch runs (scratch_<ts>.json) are gitignored and never reach this
# workflow.

on:
  pull_request:
    # `labeled`/`unlabeled` added so the cosmetic-skip escape hatch (below)
    # re-evaluates the moment a senior applies/removes the label. The default
    # types (opened, synchronize, reopened) are listed explicitly because
    # naming any type replaces the defaults.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # No `paths:` filter — this check runs on EVERY pull request so it always
    # reports a conclusion and can be required by branch protection. A workflow
    # skipped by `paths:` reports nothing at all, and a required check that
    # never reports leaves its PR stuck on "Expected — waiting for status to be
    # reported" with no way forward except a ruleset bypass. The former filter
    # moved verbatim into the `scope` step below; what this check does when it
    # applies is unchanged.

# READ-ONLY, on purpose. Nothing in this job writes any more — the bypass label
# is stripped by cosmetic-skip-strip.yml, not here. That matters because this is
# the one PR job that checks out and executes PR-authored Python (the harness
# scripts at the bottom), so it is the one job that should hold no write token
# at all. `pull-requests: read` is what the `scope` and `cosmetic` steps need.
permissions:
  contents: read
  pull-requests: read

# Cosmetic-skip escape hatch (rule 2 only). A senior applies the
# `eval-cosmetic-skip` label on a PR whose only skill-side change is
# behavior-neutral (rewording, typo) to keep the prior run log active without
# a re-run + re-grade. The label must exist in the repo once:
# `gh label create eval-cosmetic-skip`.
#
# SAFETY PROPERTY: a new commit voids the bypass, so it can never outlive the
# commit a senior approved it for — they must re-apply after each push.
#
# HOW THAT PROPERTY IS ENFORCED, AND WHY IT CHANGED (2026-07-31). It used to be
# enforced by a write: a step in THIS job removed the label on `synchronize`,
# and the `cosmetic` step below then re-read the labels API to observe the
# result. Two problems with that shape, and the second is the one that bit.
#
#   1. It is a read-after-write that only holds because both halves sit in one
#      job — a fragile footing for the property the whole hatch rests on.
#   2. On a PR from a fork, GitHub hands this workflow a READ-ONLY token no
#      matter what `permissions:` says. The removal 403s, the `|| true` on it
#      swallowed the failure, the re-read still saw the label, and rule 2
#      stayed bypassed across every later push. Green check, no annotation,
#      and the only output was a warning telling the reviewer to "confirm the
#      change is behavior-neutral" — the exact claim that had stopped being
#      true. We started taking PRs from contributors without write access on
#      2026-07-31, which turned that from theory into a live gap.
#
# So the property is now decided from the EVENT, not from the label: on
# `synchronize`, skip=0 unconditionally. No token needed, so it holds
# identically on a fork PR and an in-repo branch. Removing the label is now
# purely cosmetic — it keeps the PR's UI honest so nobody misreads a lapsed
# label as an active bypass — and lives in cosmetic-skip-strip.yml, which runs
# on `pull_request_target` and therefore has the write token forks deny this
# workflow.
#
# KNOWN COST of the split: if that companion workflow fails, the label lingers,
# and a senior "re-applying" it is a no-op — GitHub fires no `labeled` event
# for a label already present — so the PR sits red with no obvious way forward.
# Recovery is to remove and re-add the label (that does fire `unlabeled` +
# `labeled`), or to re-run this job. Loud and recoverable, which is the trade
# we want against the silent green bypass it replaces.
jobs:
  # Renamed from `check`: check-e2e-fixtures.yml also had a job named `check`,
  # so with both now running on every PR two distinct contexts would share one
  # name and a required-status-check rule could not tell them apart.
  runlogs:
    runs-on: ubuntu-latest
    steps:
      # The former `paths:` filter, moved into the job. `agents/**` is here so
      # the frontmatter lint gates plugin agent descriptions too, not just
      # skills. MCP source (packages/engine/mcp-server/src/**) is intentionally
      # absent: it is no longer embedded in the run-log snapshot, so a src-only
      # change cannot affect run-log activeness (rule 2).
      - name: Does this PR touch run logs, unit tests, skills, agents, fixtures, or the harness?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATTERNS: '^eval/runlogs/unit/|^eval/tests/unit/|^packages/engine/plugin/skills/|^packages/engine/plugin/agents/|^eval/fixtures/|^eval/harness/|^\.github/workflows/check-runlogs\.yml$'
        run: |
          set -euo pipefail
          files="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
                     --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE "$PATTERNS"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No run-log, unit-test, skill, agent, fixture, or harness path changed; reporting success without running the discipline checks."
          fi

      - name: Resolve cosmetic-skip state
        if: steps.scope.outputs.relevant == 'true'
        id: cosmetic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A new commit voids the bypass, decided from the EVENT and without
          # consulting the labels API at all. Doing it this way needs no write
          # token, which is what makes the rule hold on a fork PR — see the
          # header note. Do not "improve" this by reading the label here.
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "::notice::New commit pushed — any eval-cosmetic-skip bypass is void until a senior re-applies the label."
            exit 0
          fi

          # Every other event (opened / reopened / labeled / unlabeled) reads
          # the live label. Reading is available to a fork token too.
          labels=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx "eval-cosmetic-skip"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::eval-cosmetic-skip label present — rule 2 will be bypassed for this PR."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out PR with full history
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run runlog discipline checks
        if: steps.scope.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COSMETIC_SKIP: ${{ steps.cosmetic.outputs.skip }}
        run: python eval/harness/scripts/check_runlogs.py

      - name: Check skill tool-coverage drift (warn-only)
        if: steps.scope.outputs.relevant == 'true'
        run: python eval/harness/scripts/check_tool_coverage.py

      # The inverse of the check above: a tool name in a skill's rubric.md,
      # a test's judge_context, or an agent's body that isn't in that
      # skill's/agent's declared tools — the corpus talking about a call
      # the architecture no longer lets it make. Caught same_person and
      # source_attachments in search-records' rubric two contracts late.
      - name: Check rubric/judge_context/agent tool-mention drift (warn-only)
        if: steps.scope.outputs.relevant == 'true'
        run: python eval/harness/scripts/check_rubric_tool_drift.py

      # Blocking on hard rules (bad/mismatched name, or a description that
      # is missing, over 1024 chars, or contains angle brackets) for skills
      # AND agents; the description checks fold multi-line/block scalars, so
      # they catch a long or `<bracketed>` value on a continuation line. Soft
      # rules (unknown key, unresolvable tool) only warn. The corpus passes today.
      - name: Lint skill + agent frontmatter
        if: steps.scope.outputs.relevant == 'true'
        run: python eval/harness/scripts/check_skill_frontmatter.py
