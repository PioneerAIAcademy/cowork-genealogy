name: Engine tests

# Runs the MCP server's vitest suite (`packages/engine/mcp-server`, ~1570 tests)
# on every pull request. Nothing ran this suite in CI before, so a red test
# could sit on main indefinitely — the places-guidance drift lint
# (tests/packaging/skill-guidance.test.ts) did, for three days, after 8bf43be2
# specialized research-plan's copy. This is the same gap eval-harness-tests.yml
# was created to close one layer over, and it names that precedent on purpose.
#
# Runs UNGATED — no `paths:` filter and no per-PR scope step — because a
# complete path scope for this suite is "every top-level directory". Its
# doc-links.test.ts and adr-links.test.ts resolve every backticked path
# citation through repo-paths.ts's REPO_ROOTS (docs/ packages/ apps/ eval/
# scripts/ .github/ .claude/), so deleting or renaming a file under any of the
# seven can red the suite; and windows-wrappers.test.ts reads the root Makefile,
# scripts/**, and eval/*.bat. A gated version was dark for exactly those:
# renaming a Makefile target — a Makefile-only diff — reddens
# windows-wrappers.test.ts > "every declared target exists in the Makefile",
# and that diff matched no pattern, so the job reported success with every step
# skipped (confirmed on PR #1744). See issue #1776.
#
# The ~47–49s this costs every PR runs in parallel with the other suites and
# buys a required check that always reports a conclusion and can never be dark.
# Do NOT reintroduce a `paths:` filter: a workflow skipped by `paths:` reports
# nothing at all, leaving a required check stuck on "Expected — waiting for
# status to be reported" with no exit but a ruleset bypass.
#
# `npm test` runs the `pretest` build first (tsc), which the packaging tests do
# not strictly need but the tool-dispatch tests do — it also fails the job fast
# on a type error, before vitest starts.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v7

      # continue-on-error, because prompt-budget.test.ts is warn-only by design
      # and a step that can red the job is not. It also makes the test's own
      # fallback reachable: without it the job dies here and the
      # "origin/<base> is not available" ::warning:: path can never run.
      # BASE_REF goes through env rather than into the command text — a ref name
      # is repo-controlled input.
      - name: Fetch base branch for prompt-budget delta
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" --depth=1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/engine/mcp-server/package-lock.json

      - name: Install the pinned npm (from the packageManager field)
        run: |
          # Node 22 bundles npm 10.x; the engine's .npmrc sets engine-strict with
          # an npm >=11.12 bound, so install the pinned npm before any engine
          # `npm ci`. Version comes from packageManager (single source of truth).
          NPM_VER="$(node -p "require('./packages/engine/mcp-server/package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VER}"
          echo "Using npm $(npm --version)"

      - name: Install dependencies
        working-directory: packages/engine/mcp-server
        run: npm ci

      - name: Run vitest (pretest builds first)
        working-directory: packages/engine/mcp-server
        run: npm test
