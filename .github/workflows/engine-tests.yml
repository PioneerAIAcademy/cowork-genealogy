name: Engine tests

# Runs the MCP server's vitest suite (`packages/engine/mcp-server`)
# on every pull request. Nothing ran this suite in CI before, so a red test
# could sit on main indefinitely — the places-guidance drift lint
# (tests/packaging/skill-guidance.test.ts) did, for three days, after 8bf43be2
# specialized research-plan's copy. This is the same gap eval-harness-tests.yml
# was created to close one layer over, and it names that precedent on purpose.
#
# Runs UNGATED — no `paths:` filter and no per-PR scope step — because a
# complete path scope for this suite is "every top-level directory". Its
# doc-links.test.ts and adr-links.test.ts resolve every backticked path
# citation through repo-paths.ts's REPO_ROOTS (docs/ packages/ apps/ eval/
# scripts/ .github/ .claude/), so deleting or renaming a file under any of the
# seven can red the suite; and windows-wrappers.test.ts reads the root Makefile,
# scripts/**, and eval/*.bat. A gated version was dark for exactly those:
# renaming a Makefile target — a Makefile-only diff — reddens
# windows-wrappers.test.ts > "every declared target exists in the Makefile",
# and that diff matched no pattern, so the job reported success with every step
# skipped (confirmed on PR #1744). See issue #1776.
#
# The ~47–49s this costs every PR runs in parallel with the other suites and
# buys a required check that always reports a conclusion and can never be dark.
# Do NOT reintroduce a `paths:` filter: a workflow skipped by `paths:` reports
# nothing at all, leaving a required check stuck on "Expected — waiting for
# status to be reported" with no exit but a ruleset bypass.
#
# `npm test` runs the `pretest` build first (tsc), which the packaging tests do
# not strictly need but the tool-dispatch tests do — it also fails the job fast
# on a type error, before vitest starts.
on:
  pull_request:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v7

      # continue-on-error, because the base-branch fetch is best-effort: the
      # prompt-budget delta report reads the base side with git ls-tree and
      # falls back to absolute sizes without it. BASE_REF goes through env
      # rather than into the command text — a ref name is repo-controlled input.
      - name: Fetch base branch for prompt-budget delta
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" --depth=1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/engine/mcp-server/package-lock.json

      - name: Install the pinned npm (from the packageManager field)
        run: |
          # Node 22 bundles npm 10.x; the engine's .npmrc sets engine-strict with
          # an npm >=11.12 bound, so install the pinned npm before any engine
          # `npm ci`. Version comes from packageManager (single source of truth).
          NPM_VER="$(node -p "require('./packages/engine/mcp-server/package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VER}"
          echo "Using npm $(npm --version)"

      - name: Install dependencies
        working-directory: packages/engine/mcp-server
        # The touch is make's sentinel ($(ENGINE_DEPS)). Without it the
        # engine-smoke-stdio step below re-runs a full `npm ci` before
        # building, because make cannot tell this install happened.
        run: |
          npm ci
          touch node_modules/.make-installed

      - name: Run vitest (pretest builds first)
        working-directory: packages/engine/mcp-server
        run: npm test

      # The stdio transport the shipped .mcpb actually uses. No workflow ran it
      # either, and unlike the HTTP smoke it needs no Docker, no network and no
      # credentials -- `npm test` above has already built build/index.js, so
      # this is seconds on a job that is already required. It drives the real
      # stdio transport through src/server.ts's dispatch, which no vitest file
      # does. verify-mcpb.sh boots the packed server and lists tools, but runs
      # no call plan.
      - name: Smoke the built engine over stdio (offline rows)
        run: make engine-smoke-stdio

      # Build both shipped artifacts here, not in a workflow of their own: this
      # job is already a required check and already carries every prerequisite
      # (Node 22, the pinned npm, the engine `npm ci`), so the step is required
      # without a ruleset edit. Before this, no workflow built either artifact,
      # and a packaging break surfaced at release time rather than in a red PR.
      # verify-mcpb.sh is the part that counts: it unpacks the bundle, checks
      # the required and forbidden files, and boots the packed server to diff
      # tools/list against the manifest — "it packs" alone proves little, and
      # the plugin's frontmatter gate already runs under the runlogs check.
      - name: Build both shipped artifacts (.mcpb + plugin zip) and verify the bundle
        run: make mcpb && ./scripts/verify-mcpb.sh && make plugin

  # U15: the same suite with every tool's project I/O on PgS3ProjectStore —
  # `PROTO_STORE=pg` installs tests/helpers/pg-routing-store.ts as the process
  # store (tests/setup/proto-store.ts), and the run fails on any skipped test
  # or on a router that answered no call (tests/setup/proto-store-reporter.ts).
  # A job of its own so it runs beside `vitest` rather than after it; it is
  # advisory until the protect-main ruleset names it. The services are
  # `docker run` steps, not `services:`, because MinIO needs a command; the
  # images are the compose stack's (apps/server/proto/docker-compose.yml, which
  # says why MinIO comes from pgsty). `make engine-test-pg` is the local twin.
  vitest-pg:
    runs-on: ubuntu-latest
    env:
      PROTO_PG_DSN: postgresql://postgres:proto@localhost:5432/proto
      PROTO_S3_ENDPOINT: http://localhost:9000
      PROTO_S3_BUCKET: projects
      PROTO_S3_ACCESS_KEY: proto
      PROTO_S3_SECRET_KEY: protoproto
    steps:
      - name: Check out PR
        uses: actions/checkout@v7

      - name: Start Postgres and MinIO
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_DB=proto -e POSTGRES_PASSWORD=proto -p 5432:5432 postgres:16-alpine
          docker run -d --name minio -e MINIO_ROOT_USER=proto -e MINIO_ROOT_PASSWORD=protoproto -p 9000:9000 \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data

      - name: Set up uv (Python 3.12, for the migrations runner and the harness)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/engine/mcp-server/package-lock.json

      - name: Install the pinned npm (from the packageManager field)
        run: |
          NPM_VER="$(node -p "require('./packages/engine/mcp-server/package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VER}"

      - name: Install dependencies
        working-directory: packages/engine/mcp-server
        run: npm ci

      - name: Wait for both, create the bucket, apply the schema
        run: |
          set -euo pipefail
          ready() {
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            return 1
          }
          ready docker exec pg pg_isready -U postgres -h 127.0.0.1 || { docker logs pg; echo "::error::postgres never became ready"; exit 1; }
          ready docker exec minio mc ready local || { docker logs minio; echo "::error::minio never became ready"; exit 1; }
          docker exec minio mc alias set proto http://127.0.0.1:9000 proto protoproto
          docker exec minio mc mb --ignore-existing proto/projects
          cd apps/server && MIGRATE_PG_DSN="$PROTO_PG_DSN" uv run --frozen python proto/migrate.py

      - name: Run vitest on the Postgres store (pretest builds first)
        working-directory: packages/engine/mcp-server
        env:
          PROTO_STORE: pg
        run: npm test

      # The harness's `--store pg` cases (eval/harness/harness/pg_store_prelude.mjs).
      # They skip without a stack, so on this job's stack a skip fails the step.
      - name: Run the harness's --store pg cases
        working-directory: eval/harness
        run: |
          set -euo pipefail
          uv run --frozen pytest -q -rs tests/unit/test_pg_store_switch.py | tee "$RUNNER_TEMP/pg-switch.txt"
          if grep -qi skipped "$RUNNER_TEMP/pg-switch.txt"; then echo "::error::a --store pg case skipped"; exit 1; fi

      # The keyless arm of `make proto-store-test` (U8): the MinIO keys only as
      # AWS_*, everything else that could sign isolated, so the SDK default
      # chain's environment provider is the only way the store authenticates.
      - name: Run the store suites keyless
        working-directory: packages/engine/mcp-server
        env:
          PROTO_STORE: pg
          PROTO_S3_KEYLESS: '1'
          AWS_ACCESS_KEY_ID: proto
          AWS_SECRET_ACCESS_KEY: protoproto
          AWS_SHARED_CREDENTIALS_FILE: /nonexistent
          AWS_CONFIG_FILE: /nonexistent
          AWS_EC2_METADATA_DISABLED: 'true'
        run: npx vitest run tests/store/pg-s3-project-store.test.ts tests/http/http-server-pg.test.ts tests/store/pg-routing-store.test.ts tests/store/s3-orphan-sweep.test.ts

  # The transport smoke: drives the COMPILED build/http.js over a real MCP SDK
  # Streamable HTTP transport, against the PgS3ProjectStore bound per request
  # from X-Genealogy-Project-Id. No vitest file exercises that path, so a
  # regression in a tool's dispatch arm in src/server.ts ships green without
  # it.
  #
  # What it does NOT cover, so nobody reads more into a green tick than is
  # there: offline rows only (lead, 2026-11-01: "I don't think we need to test
  # connections in CI"). The bearer-carrying rows are every `tokenStep`, and
  # those are not offline -- so the per-request PRINCIPAL reaching a
  # FamilySearch tool is NOT checked here, and neither is the image_transcribe
  # row of #3905, which is not an offline row either. Those run only in a local
  # `make engine-smoke-http` with no SMOKE_OFFLINE_ONLY. Issue #4167 carries
  # the gap. The stack is vitest-pg's, started the same way.
  engine-smoke-http:
    runs-on: ubuntu-latest
    # The tool calls carry no client-side deadline, so a stalled one would hang
    # to the runner's 6-hour default on a required check.
    timeout-minutes: 20
    env:
      # The only load-bearing one: PROTO_PG_DSN defaults to the COMPOSE port
      # 5434 (Makefile), and this stack is on 5432. The PROTO_S3_* block that
      # vitest-pg carries is deliberately absent -- nothing in this job reads
      # it, because the Makefile passes the GENEALOGY_S3_* values itself.
      PROTO_PG_DSN: postgresql://postgres:proto@localhost:5432/proto
    steps:
      - name: Check out PR
        uses: actions/checkout@v7

      - name: Start Postgres and MinIO
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_DB=proto -e POSTGRES_PASSWORD=proto -p 5432:5432 postgres:16-alpine
          docker run -d --name minio -e MINIO_ROOT_USER=proto -e MINIO_ROOT_PASSWORD=protoproto -p 9000:9000 \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data

      - name: Set up uv (Python 3.12, for the migrations runner and the harness)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/engine/mcp-server/package-lock.json

      - name: Install the pinned npm (from the packageManager field)
        run: |
          NPM_VER="$(node -p "require('./packages/engine/mcp-server/package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VER}"

      - name: Install dependencies
        working-directory: packages/engine/mcp-server
        # The touch is make's sentinel ($(ENGINE_DEPS), Makefile). Without it
        # `make engine-smoke-http` re-runs a full `npm ci` before building.
        run: |
          npm ci
          touch node_modules/.make-installed

      - name: Wait for both, create the bucket, apply the schema
        run: |
          set -euo pipefail
          ready() {
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            return 1
          }
          ready docker exec pg pg_isready -U postgres -h 127.0.0.1 || { docker logs pg; echo "::error::postgres never became ready"; exit 1; }
          ready docker exec minio mc ready local || { docker logs minio; echo "::error::minio never became ready"; exit 1; }
          docker exec minio mc alias set proto http://127.0.0.1:9000 proto protoproto
          docker exec minio mc mb --ignore-existing proto/projects
          cd apps/server && MIGRATE_PG_DSN="$PROTO_PG_DSN" uv run --frozen python proto/migrate.py

      - name: Smoke the built engine over Streamable HTTP (offline rows)
        env:
          SMOKE_STACK_DEP: ''
          SMOKE_PG_CONTAINER: pg
          SMOKE_OFFLINE_ONLY: '1'
        run: |
          set -euo pipefail
          make engine-smoke-http 2>&1 | tee "$RUNNER_TEMP/smoke.txt"

      # Exit 0 is not proof the right rows ran. Rename SMOKE_OFFLINE_ONLY, drop
      # $(smoke_offline_flag) from the Makefile, or mistype either, and the flag
      # expands to nothing: the job runs the whole plan, most of which passes in
      # no-bearer mode, and a REQUIRED check silently starts depending on
      # FamilySearch, Wikipedia and a personal *.ts.net host being up.
      - name: The offline filter actually applied
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/smoke.txt"
          grep -q 'offline-only=true' "$log" \
            || { echo "::error::the smoke header does not say offline-only=true, so --offline-only never reached it"; exit 1; }
          # The direct property: no row that needs the network ran. These are
          # the loudest of them; any one appearing means the plan was unfiltered.
          if grep -qE '\b(wikipedia_search|wiki_search|wiki_read|wiki_place_page|record_search|person_search|place_population|external_links_search)\b' "$log"; then
            echo "::error::a network row ran in CI — the offline filter did not apply"
            grep -nE '\b(wikipedia_search|wiki_search|wiki_read|wiki_place_page|record_search|person_search|place_population|external_links_search)\b' "$log" >&2
            exit 1
          fi
          # And it ran SOMETHING: a filter that matched nothing also prints no
          # network rows.
          calls="$(sed -n 's/^\([0-9][0-9]*\) call(s),.*/\1/p' "$log" | tail -1)"
          [ -n "$calls" ] && [ "$calls" -ge 20 ] \
            || { echo "::error::expected the smoke to report at least 20 calls, got '${calls:-<none>}'"; exit 1; }
          echo "offline filter applied: $calls call(s), no network rows"
