name: Eval harness tests

# Runs the eval harness's own pytest suite on PRs that touch anything the
# suite covers. This is the gate that enforces, among other things:
#   - the skill re-invocation-section lint
#     (docs/specs/feedback-case-spec.md §5 + §9 step 7),
#   - research.json schema-stub / scenario-fixture validity against
#     docs/specs/schemas/research.schema.json,
#   - the two schema trees being byte-identical (test_schema_mirrors.py).
#
# That last one is why BOTH schema paths are in PATTERNS below. The mirror at
# packages/schema/schemas/ is not inert data any more: gen-enums.mjs generates
# the TS unions FROM it (ADR-0008 tier 2), and that test is what licenses the
# generator to read the local copy rather than docs/specs/schemas/. Matching
# only the canonical tree meant a PR editing just the mirror skipped the one
# job that runs the byte-identity check. enum-drift.test.ts compares the two
# enums.schema.json copies under engine-tests.yml, so that half had cover;
# research.schema.json and tree-gedcomx.schema.json had none.
# Both previously drifted onto main because no CI job ran these tests —
# §9 step 7 assumed a harness-test gate existed, but only the runlog
# discipline check (check-runlogs.yml) was wired up.
#
# Every test in this suite is offline and free. CI has no API key and must
# never bill the Anthropic API, so nothing here may call a model — the same
# invariant scripts/test.sh holds for the pre-PR gate. The one exception is
# the "E2E preflight smoke" step (issue #1301): it spawns the bundled Claude
# Code CLI (~10s) against a dead MCP stub, which calls no model — check 5's
# whole design is a spawn-and-ask, never a prompt — but it is not a bare
# pytest invocation like everything else here, so it's called out separately.
#
# The CLI tests (test_cli.py) import run_tests.py, which refuses to run
# against a missing/stale packages/engine/mcp-server/build/ (run_tests.py
# _check_mcp_build_fresh). So we compile the MCP server first — that's
# also why packages/engine/mcp-server/src/** and test_tool_catalog.py (which reads
# packages/engine/mcp-server/src/tools/*.ts) make mcp-server a real dependency of this
# suite.
#
# `uv sync --frozen` / `uv run --frozen`: eval/harness/uv.lock is committed
# and installed exactly as locked, never re-resolved in CI. Without this, a
# fresh resolve on every run is exposed to any new release of an unpinned
# transitive dependency — mcp 2.0.0 broke this suite on 2026-07-28 by
# removing an API claude-agent-sdk calls, and there was no lockfile to catch
# it before merge. See the mcp pin + comment in eval/harness/pyproject.toml.

#
# Runs on EVERY pull request — no `paths:` filter — so this check always
# reports a conclusion and can be required by branch protection. A workflow
# skipped by `paths:` reports nothing at all, and a required check that never
# reports leaves its PR stuck on "Expected — waiting for status to be reported"
# with no way forward except a ruleset bypass. The path scope above moved into
# the first job step verbatim; what this check does when it applies is
# unchanged, and an unrelated PR pays one ~5s step instead of a full suite.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Does this PR touch the harness, skills, fixtures, tests, or schemas?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # `^eval/runlogs/` is here because a harness test reads the real
          # committed corpus rather than a tmp_path fixture —
          # `test_every_corpus_member_yields_a_run_date`, the only guard against
          # a runlog whose filename every window would silently pin inside it. A
          # runlog-only PR is exactly the PR that adds corpus members, so
          # omitting the path meant the one check that covers them never ran.
          #
          # `^packages/engine/plugin/hooks/` and `^apps/server/` are here for
          # test_write_lockdown_parity.py, which compares the three copies of the
          # raw-write lockdown. Two of the three live outside every other branch of
          # this pattern (plugin/skills/ does not cover plugin/hooks/), so without
          # them a divergence landing in real_agent.py or guard_project_files.py
          # alone never runs the test that exists to catch it. Keep in sync with
          # IMPLEMENTATIONS in that module.
          #
          # `^apps/server/` (broadened from `^apps/server/app/agent/`) and
          # `^eval/triggering/` also gate the repo-wide encoding lint
          # (tests/unit/test_encoding_lint.py, issue #1285), which AST-scans every
          # .py in the repo: the job must run whenever a scanned .py under those
          # trees changes, or a reintroduced bare open()/read_text() there merges
          # with this check green. All apps/ Python lives under apps/server/, so
          # ^apps/server/ (not the broader ^apps/) is exact coverage -- apps/web and
          # apps/electron hold no .py.
          #
          # `^scripts/` (issue #1776): test_setup_feedback_case.py shells out to
          # scripts/setup-feedback-case.sh, and the encoding lint above AST-scans
          # scripts/claude-hooks/*.py — the only scanned .py outside the trees
          # already matched here. Without it a scripts/-only diff reported success
          # without running either check.
          PATTERNS: '^eval/harness/|^eval/runlogs/|^packages/engine/plugin/skills/|^packages/engine/plugin/hooks/|^apps/server/|^eval/triggering/|^eval/fixtures/|^eval/tests/|^docs/specs/schemas/|^packages/schema/schemas/|^packages/engine/mcp-server/|^scripts/|^\.github/workflows/eval-harness-tests\.yml$'
        run: |
          set -euo pipefail
          files="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
                     --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE "$PATTERNS"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No harness, skill, fixture, test, or schema path changed; reporting success without running pytest."
          fi

      - name: Check out PR
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/engine/mcp-server/package-lock.json

      - name: Install the pinned npm (from the packageManager field)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          # Node 22 bundles npm 10.x; the engine's .npmrc sets engine-strict with
          # an npm >=11.12 bound, so install the pinned npm before any engine
          # `npm ci`. Version comes from packageManager (single source of truth).
          NPM_VER="$(node -p "require('./packages/engine/mcp-server/package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VER}"
          echo "Using npm $(npm --version)"

      - name: Build mcp-server (harness CLI loads compiled JS from build/)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: packages/engine/mcp-server
        run: |
          npm ci
          npm run build

      - name: Install uv (+ pinned Python)
        if: steps.scope.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: 'eval/harness/uv.lock'

      - name: Sync dependencies
        if: steps.scope.outputs.relevant == 'true'
        working-directory: eval/harness
        run: uv sync --frozen

      # Undefined names (ruff F821). Runs BEFORE pytest because it catches the
      # one class of defect the suite structurally cannot: `actions/checkout`
      # resolves `refs/pull/N/merge` on a pull_request event, so this lints the
      # MERGE of the PR into main. Two branches editing different hunks of one
      # function can merge with no conflict and leave a name bound in neither —
      # green tests, NameError at runtime. Config (F821 only) is in
      # eval/harness/pyproject.toml; keep it that way rather than adding rules
      # here.
      - name: Lint for undefined names (ruff F821)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: eval/harness
        run: uv run --frozen ruff check .

      - name: Run harness unit tests (excludes live-API e2e)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: eval/harness
        run: uv run --frozen pytest

      # A dead-stub smoke test for issue #1301: check 5 must FAIL against a
      # server that never starts, and its FAIL detail must carry the stub's
      # own stderr line. The exit code is NOT load-bearing here (Promise's
      # review): CI has no ~/.familysearch-mcp/tokens.json, so check 1
      # (FamilySearch login) FAILs unconditionally on every runner regardless
      # of what check 5 does, and preflight's overall exit is 1 whenever ANY
      # check FAILs — so the RC is always 1 in this job and can never prove
      # check 5 specifically failed. Proved live: forcing check 5 to WARN
      # still leaves RC=1. What actually proves check 5 failed is grepping
      # its own line for the literal FAIL status.
      - name: E2E preflight smoke (dead MCP stub)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: eval/harness
        run: |
          set +e
          OUTPUT=$(ANTHROPIC_API_KEY=sk-ant-not-a-real-key uv run --frozen python -m e2e.preflight \
            --mcp-server-entry tests/fixtures/dead-stub.js 2>&1)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "^\[FAIL\] MCP server connects:"; then
            echo "::error::check 5 did not FAIL against a dead stub — it degraded to WARN/SKIP, or never ran"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "STUB-MARKER: refused to start"; then
            echo "::error::dead-stub marker missing from preflight output — the FAIL detail lost the captured stderr"
            exit 1
          fi
