name: Claude code review

# Runs Anthropic's `code-review` plugin against each PR and posts confirmed
# findings as inline comments. This is the self-hosted path, on API-token
# pricing — the managed Code Review product bills $15-25 per review, which this
# repo does not have budget for.
#
# The plugin prompt is high-signal by design: it reports compile/parse failures,
# clear logic errors, and unambiguous CLAUDE.md violations, and it validates
# every candidate through a subagent before posting. Style, pre-existing issues,
# and anything a linter already catches are dropped.
#
# `actions/checkout` is required — CLAUDE.md is what teaches the reviewer this
# repo's rules, and it can only read it if the tree is present.
#
# Advisory only. Never make this a required check: a review that errors or times
# out would block every merge, and the finding it posts is a claim to verify,
# not a verdict (docs/task-lifecycle.md § "Reviewing someone else's PR").

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped: `ready_for_review` fires when the PR leaves draft, so
    # the review still runs once, at the point the author asks for eyes.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The reviewer diffs against the base branch, which a shallow clone
          # does not contain.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
