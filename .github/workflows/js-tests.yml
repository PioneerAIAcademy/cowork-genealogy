name: JS workspace tests

# Runs the pnpm workspace's own checks (apps/web, apps/electron,
# packages/schema, packages/viewer-ui, eval/app) and, as a second job, the
# Playwright suite eval/app needs a browser for. eval/app was a separately
# npm-managed tree until #1488 made it a member; the second job survives only
# because turbo cannot install chromium, not because that tree is separate.
#
# Neither had any CI when this file was written. engine-tests.yml covers
# packages/engine/mcp-server, which
# is deliberately NOT a workspace member (see pnpm-workspace.yaml), so every
# other JS tree in the repo was unchecked — `turbo run test` and
# `pnpm --filter web build` existed but nothing called them. Dependency PRs
# against them therefore arrived green off unrelated scoped-out jobs, which is
# no signal at all. Same gap this repo just closed for apps/server
# (server-tests.yml).
#
# Three checks, because each catches a different class of breakage and all three
# together take well under a minute:
#   test       apps/electron, packages/viewer-ui, and apps/web vitest suites.
#   typecheck  the only coverage packages/schema has (apps/web also has the
#              vitest suite above, but typecheck still catches what it doesn't).
#   build      `pnpm --filter web build` is the same command deploy/Dockerfile
#              runs to produce the production client. A Vite/plugin major can
#              typecheck cleanly and still fail here, so this is the check that
#              actually stands behind a @vitejs/plugin-react-shaped bump.
#              Same command, NOT the same preconditions: here it inherits
#              packages/schema's generated enums from the `typecheck` step above,
#              and in the image only that stage's own COPY+install produce them.
#              So this does not stand behind the Dockerfile — nothing in CI
#              builds that image. `make deploy` runs scripts/check-deploy-stage1.mjs
#              for it.
#
# `--frozen-lockfile` / `npm ci`: the committed lockfile is installed exactly as
# written, never re-resolved. That is what makes this a real check on a
# Dependabot PR — it tests the lock in the diff rather than whatever a fresh
# resolve picks up that morning.
#
# Node 22, matching .nvmrc, the root package.json `engines` floor, and every
# other workflow in this repo.

#
# Runs on EVERY pull request — no `paths:` filter — so these checks always
# report a conclusion and can be required by branch protection. A workflow
# skipped by `paths:` reports nothing at all, and a required check that never
# reports leaves its PR stuck on "Expected — waiting for status to be reported".
# The path scope lives in each job's first step instead; an unrelated PR pays
# one ~5s step rather than a full install.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  workspace:
    name: pnpm workspace
    runs-on: ubuntu-latest
    steps:
      - name: Does this PR touch the pnpm workspace?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # packages/engine/** is excluded on purpose — it is npm-managed and
          # covered by engine-tests.yml, not by turbo.
          #
          # docs/specs/schemas/ is here because schema-interface-drift.test.ts
          # reads research.schema.json and tree-gedcomx.schema.json from it.
          # Without it, a PR that changes the canonical schema and forgets the
          # packages/schema/ mirror skips this job and reports success — the
          # lint dark in exactly the case it exists to catch. engine-tests.yml
          # lists the same path for the same reason.
          PATTERNS: '^apps/web/|^apps/electron/|^packages/schema/|^packages/viewer-ui/|^eval/app/|^eval/Start\.bat$|^docs/specs/schemas/|^package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^turbo\.json$|^tsconfig\.base\.json$|^\.github/workflows/js-tests\.yml$|^\.github/workflows/electron-release\.yml$'
        run: |
          set -euo pipefail
          files="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
                     --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE "$PATTERNS"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pnpm workspace path changed; reporting success without running checks."
          fi

      - if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v7

      # pnpm BEFORE setup-node so the npm-cache step can find it. Version is
      # read from the root package.json `packageManager` field.
      - if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: ESLint
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @genealogy/electron lint

      - name: ESLint (eval CRUD UI)
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter cowork-genealogy-eval-app lint

      - name: Run workspace tests
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm turbo run test

      - name: Typecheck
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm turbo run typecheck

      - name: Build the production web client
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web build

  # Playwright only. eval/app is a pnpm workspace member (#1488), so the
  # `workspace` job above already runs its ESLint, vitest and tsc through turbo.
  # What that job cannot do is install a browser, so this one survives rather
  # than folding in: deleting it would drop holdout-persistence.spec.ts and
  # layout-geometry.spec.ts from CI while every PR still reported green.
  eval-app-e2e:
    # The `name:` is the required-status-check context in the `protect-main`
    # ruleset — it is deliberately NOT renamed alongside the job key. Changing
    # it makes the required check `eval CRUD UI` stop reporting, and every PR
    # sits on `Expected — waiting for status` until someone edits the ruleset.
    name: eval CRUD UI
    runs-on: ubuntu-latest
    steps:
      - name: Does this PR touch eval/app?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # `^docs/specs/schemas/` (issue #1776): eval/app/scripts/gen-zod.ts
          # generates the Zod schemas this app imports, from
          # docs/specs/schemas/*.schema.json. Without it a schema-only diff
          # reported success without regenerating them.
          # `eval/Start.bat` moved to the `workspace` job's PATTERNS along with
          # the vitest suite that pins it (wiring.test.ts), so it is not listed
          # here — this job runs Playwright only.
          #
          # The workspace manifests ARE listed. eval/app renders
          # `@genealogy/schema` types, and its dependency tree is resolved from
          # the root lockfile, so a change to `packages/schema/`, `pnpm-lock.yaml`,
          # `package.json` or `pnpm-workspace.yaml` can change what these specs
          # render while touching nothing under `eval/app/`. Without them this
          # required check reports success without running — the shape it exists
          # to prevent.
          PATTERNS: '^eval/app/|^packages/schema/|^docs/specs/schemas/|^package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.github/workflows/js-tests\.yml$'
        run: |
          set -euo pipefail
          files="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
                     --paginate --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE "$PATTERNS"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No eval/app path changed; reporting success without running checks."
          fi

      - if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v7

      # pnpm BEFORE setup-node so the cache step can find it, same as the
      # workspace job. Version comes from the root package.json packageManager.
      - if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # `--filter …app...` is eval/app plus its workspace dependencies (2 of 6
      # projects), which skips apps/electron and its binary download. Still runs
      # eval/app's postinstall (scripts/gen-zod.ts), which generates the Zod
      # schemas this app imports.
      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile --filter cowork-genealogy-eval-app...

      - name: Install Playwright browsers
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter cowork-genealogy-eval-app exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter cowork-genealogy-eval-app test:e2e
