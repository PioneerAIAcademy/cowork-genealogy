<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connector probe card</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 12px; background: Canvas; color: CanvasText; font: 14px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 16px; }
  pre { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, monospace; }
</style>
</head>
<body>
<h1 id="headline">Page loaded. Waiting for the host.</h1>
<button id="again" type="button" disabled>Call read_project_view again</button>
<button class="refusal" type="button" data-label="400" data-path="not-a-project" disabled>Door refuses: 400</button>
<button class="refusal" type="button" data-label="403" data-path="/proj_0000000000000403" disabled>Door refuses: 403</button>
<button class="refusal" type="button" data-label="503" data-path="/proj_0000000000000503" disabled>Door refuses: 503</button>
<pre id="report"></pre>
<script>
// A dev stub for dev/probe-connector-server.ts: no build, no dependencies, no
// project. It speaks the MCP Apps wire protocol itself, shapes copied from
// @modelcontextprotocol/ext-apps 1.7.5.
const PROTOCOL_VERSION = "2026-01-26";
const HIDDEN_TOOL = "read_project_view";
const META_KEY = "genealogy/project";
const CONNECT_TIMEOUT_MS = 10_000;
// The clock runs while a person reads the host's approval prompt.
const CALL_TIMEOUT_MS = 300_000;
// A host need not send a result to a card mounted after the call finished.
const RESULT_WAIT_MS = 2_000;
// The report's values go into a public doc, which never holds the server's address.
const URL_PATTERN = /\bhttps?:\/\/[^\s"'<>)]+/g;

const state = {
  frameLoaded: new Date().toISOString(),
  parentIsWindow: window.parent === window,
  connect: "waiting",
  hostName: null,
  hostVersion: null,
  protocolVersion: null,
  capabilities: null,
  displayMode: null,
  availableDisplayModes: null,
  contextChanges: 0,
  input: null,
  resultKeys: null,
  resultError: null,
  meta: null,
  cancelled: null,
  calls: [],
  pageErrors: [],
};

const pending = new Map();
let nextId = 1;
let waitTimer;

function post(message) {
  window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");
}

function request(method, params, timeoutMs) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error(`no answer to ${method} in ${timeoutMs} ms`));
    }, timeoutMs);
    pending.set(id, { resolve, reject, timer });
    post({ id, method, params });
  });
}

function resultText(result) {
  const blocks = Array.isArray(result.content) ? result.content : [];
  return blocks.filter((block) => block.type === "text").map((block) => block.text).join("\n") || "no text";
}

/** What the card saw, for the log. Argument names only: a value can be a path. */
function seen() {
  return {
    host: state.hostName,
    version: state.hostVersion,
    protocol: state.protocolVersion,
    mode: state.displayMode,
    modes: state.availableDisplayModes,
    serverTools: Boolean(state.capabilities?.serverTools),
    inputArgs: state.input ? Object.keys(state.input) : null,
    resultKeys: state.resultKeys,
    metaArrived: state.resultKeys ? state.meta !== null : null,
    earlierCalls: state.calls.filter((call) => call.status !== "running").map((call) => call.status),
  };
}

async function hiddenCall(trigger, refusedPath) {
  const call = { n: state.calls.length + 1, trigger, status: "running" };
  // The brief's interface: the card passes the model's projectPath to read_project_view.
  const projectPath = refusedPath ?? state.input?.projectPath ?? state.meta?.echo?.projectPath;
  const args = { part: "document", seen: JSON.stringify(seen()), ...(typeof projectPath === "string" ? { projectPath } : {}) };
  state.calls.push(call);
  render();
  const started = performance.now();
  try {
    const result = await request("tools/call", { name: HIDDEN_TOOL, arguments: args }, CALL_TIMEOUT_MS);
    if (result.isError) {
      call.status = "tool error";
      call.text = resultText(result);
    } else {
      call.status = "ok";
      call.served = result.structuredContent?.served ?? null;
    }
  } catch (error) {
    call.status = "failed";
    call.text = error.message;
  }
  call.ms = Math.round(performance.now() - started);
  render();
}

function onToolInput(params) {
  if (state.input) return;
  state.input = params?.arguments ?? {};
  if (!state.resultKeys) waitTimer = setTimeout(() => hiddenCall("no result yet"), RESULT_WAIT_MS);
}

function onToolResult(result) {
  if (state.resultKeys) return;
  clearTimeout(waitTimer);
  state.resultKeys = Object.keys(result ?? {});
  state.meta = result?._meta?.[META_KEY] ?? null;
  if (result?.isError) state.resultError = resultText(result);
  hiddenCall("tool result");
}

function onContext(context) {
  if (context.displayMode) state.displayMode = context.displayMode;
  if (context.availableDisplayModes) state.availableDisplayModes = context.availableDisplayModes;
  if (context.theme) document.documentElement.style.colorScheme = context.theme;
}

function onHostRequest(message) {
  if (message.method === "ping" || message.method === "ui/resource-teardown") {
    post({ id: message.id, result: {} });
  } else {
    post({ id: message.id, error: { code: -32601, message: `Method not found: ${message.method}` } });
  }
}

function onHostNotification(message) {
  if (message.method === "ui/notifications/tool-input") onToolInput(message.params);
  if (message.method === "ui/notifications/tool-result") onToolResult(message.params);
  if (message.method === "ui/notifications/tool-cancelled") {
    clearTimeout(waitTimer);
    state.cancelled = message.params?.reason ?? "no reason given";
  }
  if (message.method === "ui/notifications/host-context-changed") {
    state.contextChanges += 1;
    onContext(message.params ?? {});
  }
}

window.addEventListener("message", (event) => {
  if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
  const message = event.data;
  if (message.method === undefined) {
    const waiter = pending.get(message.id);
    if (!waiter) return;
    pending.delete(message.id);
    clearTimeout(waiter.timer);
    if (message.error) waiter.reject(new Error(`${message.error.code}: ${message.error.message}`));
    else waiter.resolve(message.result);
  } else if (message.id === undefined) {
    onHostNotification(message);
  } else {
    onHostRequest(message);
  }
  render();
});

window.addEventListener("error", (event) => {
  state.pageErrors.push(event.message);
  render();
});

/** ext-apps' App.setupSizeChangedNotifications: without it a host may not size the frame. */
function trackSize() {
  let queued = false;
  let width = 0;
  let height = 0;
  const send = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      const root = document.documentElement;
      const saved = root.style.height;
      root.style.height = "max-content";
      const nextHeight = Math.ceil(root.getBoundingClientRect().height);
      root.style.height = saved;
      const nextWidth = Math.ceil(window.innerWidth);
      if (nextWidth === width && nextHeight === height) return;
      width = nextWidth;
      height = nextHeight;
      post({ method: "ui/notifications/size-changed", params: { width, height } });
    });
  };
  send();
  const observer = new ResizeObserver(send);
  observer.observe(document.documentElement);
  observer.observe(document.body);
}

function callLine(call) {
  const head = `${call.n} (${call.trigger}): ${call.status}`;
  if (call.status === "running") return head;
  const served = call.served ? `; server's call ${call.served.n}, token_seq ${call.served.token_seq}` : "";
  const text = call.text ? `: ${call.text}` : "";
  return `${head} in ${call.ms} ms${served}${text}`;
}

function headline() {
  if (state.connect === "failed") return "The host refused the page or did not answer.";
  if (state.connect === "waiting") return "Page loaded. Waiting for the host.";
  const last = state.calls[state.calls.length - 1];
  if (!last) return "Card drawn. No hidden call yet.";
  if (last.status === "running") return "Card drawn. Hidden call running.";
  return last.status === "ok" ? "Card drawn. Hidden call ok." : "Card drawn. Hidden call did not work.";
}

function render() {
  const yesNo = (value) => (value === null ? "none yet" : value ? "yes" : "no");
  const lines = [
    `frame loaded: ${state.frameLoaded}`,
    `window.parent === window: ${state.parentIsWindow}`,
    `connect: ${state.connect}`,
    `host: ${state.hostName ?? "unknown"} ${state.hostVersion ?? ""}`,
    `protocol: ${state.protocolVersion ?? "unknown"}`,
    `display mode: ${state.displayMode ?? "unknown"}; offered: ${state.availableDisplayModes?.join(", ") ?? "unknown"}`,
    `host-context-changed events: ${state.contextChanges}`,
    `host capabilities: ${JSON.stringify(state.capabilities)}`,
    `tool input: ${JSON.stringify(state.input)}`,
    `tool result keys: ${state.resultKeys?.join(", ") ?? "none yet"}`,
    `tool result error: ${state.resultError ?? "none"}`,
    `tool cancelled: ${state.cancelled ?? "no"}`,
    `result _meta arrived: ${yesNo(state.resultKeys ? state.meta !== null : null)}`,
    `canary in _meta: ${state.meta?.canary ?? "none"}`,
    `token_seq in _meta: ${state.meta?.token_seq ?? "none"}`,
    `hidden calls: ${state.calls.length}`,
    ...state.calls.map((call) => `  ${callLine(call)}`),
    `page errors: ${state.pageErrors.join("; ") || "none"}`,
  ];
  document.getElementById("headline").textContent = headline();
  document.getElementById("report").textContent = lines.join("\n").replace(URL_PATTERN, "<url>");
}

document.getElementById("again").addEventListener("click", () => hiddenCall("tap"));
for (const button of document.querySelectorAll(".refusal")) {
  button.addEventListener("click", () => hiddenCall(`door ${button.dataset.label}`, button.dataset.path));
}

async function connect() {
  render();
  try {
    const result = await request(
      "ui/initialize",
      {
        appInfo: { name: "genealogy-connector-probe-card", version: "0.0.1" },
        appCapabilities: { availableDisplayModes: ["inline"] },
        protocolVersion: PROTOCOL_VERSION,
      },
      CONNECT_TIMEOUT_MS,
    );
    state.connect = "connected";
    state.hostName = result.hostInfo?.name ?? null;
    state.hostVersion = result.hostInfo?.version ?? null;
    state.protocolVersion = result.protocolVersion ?? null;
    state.capabilities = result.hostCapabilities ?? null;
    onContext(result.hostContext ?? {});
    post({ method: "ui/notifications/initialized" });
    trackSize();
    for (const button of document.querySelectorAll("button")) button.disabled = false;
  } catch (error) {
    state.connect = "failed";
    state.pageErrors.push(error.message);
  }
  render();
}

connect();
</script>
</body>
</html>
