[project]
name = "cowork-genealogy-eval-harness"
version = "0.1.0"
description = "Python harness for Cowork Genealogy skill evaluation. See docs/specs/unit-test-spec.md."
requires-python = ">=3.11"
dependencies = [
    # claude-agent-sdk: lower bound is what we built against; upper bound is
    # the next major (none currently). The harness uses
    # `project_key_for_directory` for session-store cleanup, which has been
    # present since 0.1.x — if a future major drops it, workspace.py raises
    # at import time rather than silently leaking ~/.claude/projects/ entries.
    "claude-agent-sdk>=0.1.81,<0.2",
    # mcp: claude-agent-sdk declares `mcp>=1.19.0` with NO upper bound, so an
    # unpinned resolve can float onto a new mcp major and break it silently.
    # mcp 2.0.0 (released 2026-07-28) removed/renamed Server.list_tools,
    # which claude_agent_sdk.create_sdk_mcp_server calls -- broke CI the same
    # day (AttributeError: 'Server' object has no attribute 'list_tools').
    # This is an upper-bound guard until claude-agent-sdk itself supports
    # mcp 2.x -- delete this line once it does.
    "mcp>=1.29,<2",
    "anthropic>=0.120.2",
    "jsonschema>=4.22.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.6",
]

[tool.ruff.lint]
# Undefined-name detection ONLY. This is not a style gate and must not grow
# into one — every added rule is a new way for an unrelated PR to go red.
#
# What it catches that pytest cannot: two branches editing different hunks of
# the same function merge cleanly and leave a name bound in neither. That is
# how a `transcript.append(...)` survived the rename of `transcript` to
# `narration` in `e2e/orchestrator.py` — clean merge, 1478 tests green, and a
# NameError only once the deny path it sits in actually fires, mid-run.
# A branch cannot lint itself out of this; only the merge result can be checked,
# which is why the gate runs in CI (checkout resolves `refs/pull/N/merge`).
select = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
