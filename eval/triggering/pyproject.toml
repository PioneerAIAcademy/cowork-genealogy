[project]
name = "genealogy-triggering"
version = "0.0.0"
description = "Corpus-derived description/trigger optimizer for genealogy skills (vendored skill-creator run_loop + build_eval_set)."
requires-python = ">=3.10"

# Stdlib only — no dependencies. The vendored scripts/ modules use 3.10+ syntax
# (e.g. `str | None` evaluated at runtime), so this pins the interpreter; `uv run`
# provides it without touching the system python3. Not an installable package.
[tool.uv]
package = false
# Copy instead of hardlink when materialising packages into .venv — the OneDrive
# hardlink failure documented in eval/harness/uv.toml. A no-op today (no
# dependencies + package = false means uv installs nothing, so there is nothing
# to hardlink; verified on a OneDrive clone). It is here so that adding the
# first dependency to this project cannot silently re-arm that failure for a
# genealogist running eval/OptimizeSkill.bat.
link-mode = "copy"
