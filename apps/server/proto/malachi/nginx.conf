# The edge of the malachi stack. Funnel maps https://malachi.taild68f1b.ts.net/ to host
# loopback 8006, and this is the only process that publishes it.
#
# Sign-in codes and state travel in query strings, so no log line here may carry one: the
# access format uses $uri, and error_log stays at crit because the error level prints the
# whole request line when an upstream fails. tests/test_malachi_stack.py pins both.
worker_processes auto;
error_log stderr crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # The rootfs is read-only; /tmp is the one tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format edge escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
                                '"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
    access_log /dev/stdout edge;

    # Compose's DNS, read per request through the variables below, so a recreated web or
    # tools container is found with no edge restart and a stopped one is a 502, not a crash.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8006;

        client_max_body_size 26m;
        proxy_http_version 1.1;
        proxy_buffering off;
        # Bodies stream, so the tiers' own checks answer before a stranger's 26 MB lands here.
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        set $web_upstream http://web:8085;
        set $tools_upstream http://tools:8787;

        # The deep checks stay private; /livez is the public probe.
        location = /healthz { return 404; }
        location = /api/health { return 404; }

        location = /mcp {
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_pass $tools_upstream;
        }

        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass $tools_upstream;
        }

        # The MCP App's page images: one exact path, the signed token in the query.
        location = /img {
            proxy_pass $tools_upstream;
        }

        location / {
            proxy_pass $web_upstream;
        }
    }
}
