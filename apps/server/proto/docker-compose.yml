# D3 compose skeleton for the search-agent prototype
# (docs/plan/search-agent-prototype.md, "Week 1" D3). Throwaway scaffolding by the
# plan's own words; ./sql and the shim's decide() are what the real build keeps.
#
# Topology the plan pins, and why it is written down: the shim is its OWN service
# with the docker socket mounted, separate from the worker. A step-ceiling kill of
# the worker must not take the shim down with it (nothing would then issue
# ChangeMessageVisibility(0)), and a whole-container loss must still redeliver.
# Fixed container_names (proto-*) so the shim's kill target is a stable string.
#
# Host ports: postgres 5434 (5433 belongs to the P1 probe's p1-postgres), minio
# 9000/9001, elasticmq 9324 (SQS) / 9325 (stats). The worker is reachable inside
# the compose network only.
#
# sqsd: this base profile keeps the 1800 s ceiling kill, the doubling backoff and
# unlimited retries (SQSD_MAX_RETRIES 0, no SQSD_RETENTION_PERIOD_S, so the worker's
# dead-letter sweep is off -- it must never close old rows on the persistent
# proto-pgdata volume). docker-compose.sqsd.yml layers the interim sqsd behaviour on top.
#
# Offline shape checks: apps/server/tests/test_proto_config.py.
name: proto

services:
  postgres:
    image: postgres:16-alpine
    container_name: proto-postgres
    environment:
      POSTGRES_DB: proto
      POSTGRES_PASSWORD: proto
    ports:
      - "5434:5432"
    # No initdb mount (U9): the `migrate` one-shot below is the schema's one applier.
    volumes:
      - proto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proto"]
      interval: 2s
      timeout: 3s
      retries: 30

  # pgsty/minio (Docker Hub), not minio/minio or quay.io/minio/minio: Docker Hub's
  # minio/minio denied anonymous pulls by ~2026-09-18; quay.io/minio/minio followed
  # by 2026-10-05 ("unauthorized: access to the requested resource is not authorized").
  # pgsty is a community fork that ships the same minio binary with mc included (as a
  # symlink to mcli), so the healthcheck and the minio-init one-shot work unchanged.
  # Both services use ONE image, eliminating the separate mc pin.
  # Cold-pull verify: docker compose -f apps/server/proto/docker-compose.yml pull minio minio-init
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: proto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proto
      MINIO_ROOT_PASSWORD: protoproto
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - proto-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: creates the `projects` bucket, then exits 0.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: proto-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set proto http://minio:9000 proto protoproto
        && mc mb --ignore-existing proto/projects
    restart: "no"

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: proto-elasticmq
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:9324/?Action=ListQueues' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  # U9 one-shot: applies the pending sql/*.sql through proto/migrate.py (one transaction per
  # file, recorded in schema_migrations), then exits 0. worker, web and tools wait for that
  # exit and only read the ledger; none of them runs DDL. The worker's image, which carries
  # migrate.py, sql/ and psycopg (WORKDIR /opt/genealogy/server); its HEALTHCHECK polls the
  # worker's /healthz, so it is off here. The worker's `build:`, under compose's own image
  # name: `image:` alone makes an `up` that names tools without the worker PULL it
  # (measured with --dry-run, "pull access denied"), and one `image:` shared by both builds
  # fails `proto-up`'s parallel build ("image ... already exists", measured 2026-10-05).
  # The second build is all cache.
  # MIGRATE_PG_DSN is the schema owner's, set on this service alone: migrate.py reads no
  # other variable.
  migrate:
    build:
      context: ../../..
      dockerfile: apps/server/proto/worker/Dockerfile
    container_name: proto-migrate
    command: ["python3", "proto/migrate.py"]
    environment:
      MIGRATE_PG_DSN: postgresql://postgres:proto@postgres:5432/proto
      # The worker's note on OPENSSL_armcap: the same image, the same SIGILL.
      OPENSSL_armcap: ${OPENSSL_armcap:-0}
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  # D9-10 worker: one patron turn per message through the Agent SDK. Context is the
  # repo root (the image carries packages/engine/plugin and apps/server); the root
  # .dockerignore drops node_modules, .git, .venv and eval. Its tools are the D16 `tools`
  # service below (TOOL_SERVER_URL, which the worker requires), ONE
  # process for every turn and every patron -- bearer as Authorization, the turn's
  # project id as X-Genealogy-Project-Id, the store bound per request. Only the recipes
  # that wait for `tools` can run a real turn -- proto-up, proto-turn, proto-kill,
  # proto-demo, proto-demo-auto. proto-up-core deliberately leaves `tools` down for the
  # D3 smoke, whose stub arms never build worker options, so they never reach it.
  worker:
    build:
      context: ../../..
      dockerfile: apps/server/proto/worker/Dockerfile
    container_name: proto-worker
    # D14 kills this container on a ceiling overrun (and the D3 `crash` turn exits it);
    # every subsequent redelivery needs a worker to POST to.
    restart: unless-stopped
    # U5: on SIGTERM the worker answers in-flight POSTs 500, stops their CLIs and exits
    # within SHUTDOWN_GRACE_S (20); this must cover that, or compose SIGKILLs at 10 s and
    # the 500 is lost.
    stop_grace_period: 30s
    environment:
      # U11: the worker honours its dev-only paths -- the D3 smoke's stub turns,
      # BLOCKED_TOOLS, an unset QUEUE_URL, the default FS_TOKEN_ENC_KEY -- only when this is
      # true. Compose only, worker only: never in an image or a Beanstalk template
      # (test_proto_bundles.py), and the web tier never reads it.
      DEV_PATHS: "true"
      TOOL_SERVER_URL: http://tools:8787/mcp
      PG_DSN: postgresql://postgres:proto@postgres:5432/proto
      # The model. Passed through from the host environment at `up` time, never a
      # literal here; the stub arms run with it empty.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      # MODEL_PROVIDER=gateway only: an Anthropic-Messages gateway (tap-agentgateway's
      # /bedrock), its consumer key, and whether tool search is on (off below v1.6).
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      GATEWAY_TOOL_SEARCH: ${GATEWAY_TOOL_SEARCH:-false}
      # U3: the FamilySearch bearer is the turn's project owner's grant, read from Postgres
      # (familysearch_tokens) at the start of EVERY attempt and held under that patron's
      # attempt lock; the web tier is its only refresher. No token reaches this service any
      # other way. The key is the web tier's (one value for both), passed through and never
      # a literal; the CLI inherits no worker variable (options.CLI_ENV_KEEP), and each turn's
      # CLI runs as its own slot user (the image's WORKER_TURN_USERS), so the kernel keeps it
      # out of the worker's /proc and every other turn's dirs. `make proto-grant` stores the
      # dev patron's grant.
      FS_TOKEN_ENC_KEY: ${FS_TOKEN_ENC_KEY:-}
      # An attempt starts only on a session at most this old (8 h less one 1,800 s attempt
      # less 600 s, so a shim-killed attempt cannot outlive its session), else waits up to
      # FS_GRANT_WAIT_S -- below the shim's 1,800 s kill -- for the refresher.
      FS_GRANT_MAX_START_AGE_S: ${FS_GRANT_MAX_START_AGE_S:-26400}
      FS_GRANT_WAIT_S: ${FS_GRANT_WAIT_S:-300}
      # cryptography >= 47's linux/aarch64 wheel dies with SIGILL at import inside a colima
      # (Virtualization.Framework) VM on Apple silicon: OpenSSL's CPU-capability probe runs an
      # instruction the VM advertises but traps (measured 2026-10-02, 46.0.3 imports, 47.0.0
      # and 48.0.1 do not; OPENSSL_armcap=0 fixes it). 0 masks OpenSSL's ARM acceleration, which
      # a dev stack does not need; x86 ignores it. Compose only: never in an image.
      OPENSSL_armcap: ${OPENSSL_armcap:-0}
      # The e2e harness's tree-read block for fixture runs (bare MCP tool names, comma-
      # separated; proto-demo exports the harness's five). Empty: no block.
      BLOCKED_TOOLS: ${BLOCKED_TOOLS:-}
      # D18's autonomous arm: the worker's Stop hook vetoes the model's voluntary yield up
      # to this many times per turn. Only for a message WITHOUT max_nudges: the web tier
      # stamps its own cap (below) on every message, and the worker prefers it, so this 0
      # does not switch the hook off for a web-tier turn.
      AUTONOMOUS_MAX_NUDGES: ${AUTONOMOUS_MAX_NUDGES:-0}
      # 1e: the per-session spend cap (0 is off) and the price vector that meters it, each
      # defaulting to app/agent/spend.py's own value. Read once at start, so a new value
      # needs the container recreated (`up -d` does), not restarted.
      SESSION_SPEND_CAP_USD: ${SESSION_SPEND_CAP_USD:-35}
      PRICE_INPUT_PER_MTOK: ${PRICE_INPUT_PER_MTOK:-3.0}
      PRICE_CACHE_WRITE_PER_MTOK: ${PRICE_CACHE_WRITE_PER_MTOK:-3.75}
      PRICE_CACHE_READ_PER_MTOK: ${PRICE_CACHE_READ_PER_MTOK:-0.30}
      PRICE_OUTPUT_PER_MTOK: ${PRICE_OUTPUT_PER_MTOK:-15.0}
      # 1b: where a message held during a turn is released to when that turn ends. The
      # SAME queue the web tier and the shim use. The worker is the only component that
      # knows a turn finished -- the web tier is stateless and the browser may be closed
      # -- so the handover is its job. Empty means no release, which needs DEV_PATHS.
      QUEUE_URL: http://elasticmq:9324/000000000000/turns
      # U7: the release is SigV4-signed (proto/enqueue.py). elasticmq ignores signatures;
      # these dummies exercise the default-chain (env) path and keep it off IMDS. Not
      # GENEALOGY_*: the worker holds no store credentials, and the test says so.
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      AWS_EC2_METADATA_DISABLED: "true"
      # U5: sqsd's MaxRetries and VisibilityTimeout as the worker's last-receive close and
      # sweep read them. 0 is off: no close, no sweep. No SQSD_RETENTION_PERIOD_S here, so
      # the sweep's backstop is off too; docker-compose.sqsd.yml sets all three.
      SQSD_MAX_RETRIES: "${SQSD_MAX_RETRIES:-0}"
      SQSD_VISIBILITY_TIMEOUT_S: "${SQSD_VISIBILITY_TIMEOUT_S:-0}"
      SWEEP_INTERVAL_S: "${SWEEP_INTERVAL_S:-0}"
      ENGINE_PLUGIN_DIR: /opt/genealogy/plugin
      WORKER_CWD: /project
      TMPDIR: /tmp
    # The transcript, its per-turn CLAUDE_CONFIG_DIR and the oversized-result spill are
    # writable-not-durable: a tmpfs, discarded with the container.
    tmpfs:
      - /tmp:size=1g,mode=1777
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy

  # D11-12 web tier: POST /messages -> turns row + user_msg event + SendMessage; GET
  # /events and the SSE stream read session_events / session_activity / documents.
  # Depends on postgres, the migration and the queue only -- never on the worker: until
  # D9-10 lands it is driven against rows proto/drive.py inserts. Context is the repo root
  # (like the tools image) so the image carries enqueue.py, migrate.py, sql/ and the
  # engine's familysearch.json.
  web:
    build:
      context: ../../..
      dockerfile: apps/server/proto/web/Dockerfile
    container_name: proto-web
    restart: unless-stopped
    # Loopback only. U2 put patron sign-in in front of every session route, but dev-login
    # (on with DEV_LOGIN=true while FamilySearch sign-in is off and PUBLIC_URL is http)
    # signs anyone in, so the tier must still not be LAN-reachable. docker-compose.fs-signin.yml adds the 1837
    # publish the FamilySearch round-trip needs.
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      PG_DSN: postgresql://postgres:proto@postgres:5432/proto
      # The same queue the shim reads (QUEUE_URL below); the tier keys SendMessage on it.
      QUEUE_URL: http://elasticmq:9324/000000000000/turns
      # U7: SendMessage is SigV4-signed (proto/enqueue.py). elasticmq ignores signatures;
      # these dummies exercise the default-chain (env) path and keep it off IMDS.
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      AWS_EC2_METADATA_DISABLED: "true"
      POLL_S: "1"
      SSE_PING_S: "15"
      # U2 sign-in (web/auth.py). The defaults are dev-only; web/auth.py refuses to start
      # with a default secret on an https PUBLIC_URL or with FamilySearch sign-in on, and
      # the overlay requires both secrets. FamilySearch sign-in stays off here
      # (dev-login only) -- docker-compose.fs-signin.yml turns it on, which turns dev-login
      # off. DEV_LOGIN is the opt-in no template may set (U11); a literal, so no host
      # variable at `up` time switches it.
      DEV_LOGIN: "true"
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8085}
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FS_TOKEN_ENC_KEY: ${FS_TOKEN_ENC_KEY:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      FAMILYSEARCH_WEB_ENABLED: ${FAMILYSEARCH_WEB_ENABLED:-false}
      # U3: this tier refreshes each patron's grant, between attempts, once its session is
      # this old and the patron has an open turn; the loop runs every interval.
      FS_GRANT_REFRESH_AGE_S: ${FS_GRANT_REFRESH_AGE_S:-3600}
      FS_GRANT_REFRESH_INTERVAL_S: ${FS_GRANT_REFRESH_INTERVAL_S:-30}
      # The worker's note on OPENSSL_armcap: the same cryptography wheel, the same SIGILL.
      OPENSSL_armcap: ${OPENSSL_armcap:-0}
      # PR #2870 item 1a: the Stop hook's veto cap, stamped on every queue message
      # this tier enqueues (admit_message -> body.max_nudges) and preferred by run_turn over
      # the worker's own AUTONOMOUS_MAX_NUDGES. It lives HERE, not on MessageBody: the
      # cap is the operator's, so a request field would let a signed-in patron set their
      # own nudge budget. The worker cannot tell the browser from `make proto-demo` -- there is no
      # browser path it can see -- so each recipe recreates this container with its own
      # export instead, and proto-demo exports 0 to stay a one-turn run.
      #
      # 60 is sized on STEP count, not on the nudge histogram: measured over the 189
      # committed e2e runs, Skill/Task/Agent steps per run are median 15, p90 25, p99 51,
      # max 76 -- so 60 clears p99 with margin. The nudge histogram (median 1, p90 4)
      # describes runs under a harness that FORBIDS yielding and does not describe this
      # regime. The cap is not the spend control either; 1e's per-session bound is.
      # test_proto_config re-derives the p99 from the corpus and fails if this drops below it.
      AUTONOMOUS_MAX_NUDGES: ${AUTONOMOUS_MAX_NUDGES:-60}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy

  # D16 tool server: the genealogy engine (build/http.js) on Streamable HTTP at /mcp,
  # /healthz for the wait. Context is the repo root so the engine's src/ compiles inside
  # the image (apps/server/proto/tools/Dockerfile). One long-lived process serves every
  # patron's turns: each request binds a PgS3ProjectStore from its X-Genealogy-Project-Id
  # header on the store below, and a request without one reaches no store at all (never
  # the file backend). The worker reads the same Postgres (PG_DSN) for research.json.
  tools:
    build:
      context: ../../..
      dockerfile: apps/server/proto/tools/Dockerfile
    container_name: proto-tools
    restart: unless-stopped
    environment:
      # The store, in-network hosts; its Postgres is the worker's PG_DSN and its anchor
      # the worker's WORKER_CWD, which test_proto_config asserts. No GENEALOGY_PROJECT_ID:
      # the id is per request.
      GENEALOGY_PG_DSN: postgresql://postgres:proto@postgres:5432/proto
      GENEALOGY_S3_ENDPOINT: http://minio:9000
      GENEALOGY_S3_BUCKET: projects
      GENEALOGY_S3_ACCESS_KEY: proto
      GENEALOGY_S3_SECRET_KEY: protoproto
      GENEALOGY_ANCHOR_PATH: /project
      # The per-user config, the four keys src/hosted-config-env.ts reads from the env:
      # one shared process, so these are per-STACK here rather than per patron, which is
      # what a one-patron prototype wants. Without the OpenRouter key `image_transcribe`
      # answers with its no-key error. env.sh exports it from eval/.env.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      WIKI_API_URL: ${WIKI_API_URL:-}
      POP_STATS_URL: ${POP_STATS_URL:-}
    # Project state lives in Postgres/S3, so nothing writes to the rootfs; /tmp is the
    # one rw path.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # {"hosted": true}: auth errors point at the web app's reconnect, not the login tool.
      - ./tools/config.json:/root/.familysearch-mcp/config.json:ro
    # Loopback only: the server has no auth beyond header -> principal (README).
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  shim:
    build: ./shim
    container_name: proto-shim
    restart: unless-stopped
    # On SIGTERM the shim lets its in-flight long poll (up to 20 s) return, hands
    # back anything that poll delivered, and waits for in-flight POSTs, all inside
    # STOP_GRACE_S; this must cover that budget or compose SIGKILLs it at 10 s and
    # the orphaned poll swallows the next message for the whole visibility timeout.
    stop_grace_period: 30s
    volumes:
      # Read-write on purpose: killing the worker is a POST to the engine API.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # The shim derives the SQS endpoint from this URL and supplies its own dummy
      # credentials; elasticmq ignores them.
      QUEUE_URL: http://elasticmq:9324/000000000000/turns
      WORKER_URL: http://worker:8080/turn
      WORKER_CONTAINER: proto-worker
      HTTP_CONNECTIONS: "2"
      # The step ceiling: 1800 s unless the `up` environment sets READ_TIMEOUT_S
      # (proto-demo-auto exports it too, but at the same pinned 1800 since 0b brought
      # the ceiling back down -- it buys MORE attempts now, not a longer one; proto-demo, proto-turn and
      # proto-kill run at the default). docker-compose.ceiling.yml lowers it for the
      # smoke's ceiling case and changes nothing else.
      READ_TIMEOUT_S: "${READ_TIMEOUT_S:-1800}"
      BACKOFF_BASE_S: "5"
      BACKOFF_MAX_S: "300"
      # U5: 0 is unlimited retries, today's behaviour. Above 0 (docker-compose.sqsd.yml)
      # a receive past it goes to DLQ_URL instead of the worker.
      SQSD_MAX_RETRIES: "${SQSD_MAX_RETRIES:-0}"
      DLQ_URL: http://elasticmq:9324/000000000000/turns-dlq
    depends_on:
      worker:
        condition: service_healthy
      elasticmq:
        condition: service_healthy

volumes:
  proto-pgdata:
  proto-minio:
