# U28: the FamilySearch edge in front of the web tier, as measured under an Alias or a
# Service Group binding (F18/F11): https://<host>/service/search/agent-tools/<name>/x
# reaches the origin as /x with the X-Orig-* headers below, and a silent stream is cut at
# ~45 s. Whether the edge maps the bare prefix (no slash) to / is unmeasured; this
# assumes it does.
server {
    listen 8090;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 45s;
    proxy_set_header Connection "";
    proxy_set_header X-Orig-Base /service/search/agent-tools/web;
    proxy_set_header X-Orig-Host $host;
    proxy_set_header X-Orig-Proto https;
    proxy_set_header X-Orig-Port 443;

    location = /service/search/agent-tools/web {
        proxy_pass http://web:8085/;
    }

    location /service/search/agent-tools/web/ {
        proxy_pass http://web:8085/;
    }

    location / {
        return 404;
    }
}
