# POST /api/sessions/{id}/files takes up to 25 MB (UPLOAD_MAX_BYTES), and FamilySearch's edge
# passed a 25 MiB body (handoff F18). nginx's 1 MB default answered 413 to an upload of
# 1,100 KiB through the alias while 1,000 KiB reached the tier (handoff U28, FS112 u28-web,
# 2026-10-31, n=1). 26m leaves room for the multipart envelope around a 25 MB file.
client_max_body_size 26m;
