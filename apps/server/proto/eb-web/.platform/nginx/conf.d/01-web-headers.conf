# Under an alias the tier shares the .familysearch.org cookie jar, so every FamilySearch,
# Imperva and analytics cookie reaches it with wb_session. nginx's default 4 x 8k buffers
# answered 400 to a Cookie header from ~8.3 KB, while FamilySearch's edge passes 13 KB
# (handoff U28, FS112 u28-web, 2026-10-31, n=1). With 32k the edge is the binding limit: it
# refuses a 14 KB header, and the load balancer 18 KB across many cookies.
large_client_header_buffers 4 32k;
