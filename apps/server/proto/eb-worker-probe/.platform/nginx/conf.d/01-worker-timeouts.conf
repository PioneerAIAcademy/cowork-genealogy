# sqsd POSTs to http://localhost:80, i.e. through the platform's nginx, which
# proxies to the app on :8000 with a default proxy_read_timeout of 60s. Without
# this override nginx answers 504 at 60s and sqsd retries -- the probe would be
# measuring nginx, not InactivityTimeout. 36000s is InactivityTimeout's maximum,
# so nginx is never the binding constraint. See README.md, "nginx is in the path".
proxy_read_timeout 36000s;
