# One MCP request is one tool call, and a call may run 1800 s (image_transcribe's longest
# measured was 844 s); nginx's 60 s default would answer 504 first. Equal to the CLI's
# per-server MCP timeout and the ALB IdleTimeout. Bodies stay under the 1 MB default
# (largest observed input 53 KB).
proxy_read_timeout 1800s;
proxy_send_timeout 1800s;
