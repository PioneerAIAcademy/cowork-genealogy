// elasticmq for the D3 prototype (docs/plan/search-agent-prototype.md, "Week 1" D3).
// Two queues: `turns`, and `turns-dlq` (U5, below). The `turns` visibility timeout sits
// ABOVE every step ceiling the shim can run at -- since PR #2870 item 0b that is one
// number, the pinned 1800 s, both as the compose default and as what proto-demo-auto
// exports as READ_TIMEOUT_S (Makefile) -- with slack. The shim never extends visibility
// while a POST is in flight, so an attempt longer than this literal is redelivered mid-flight and the
// worker runs the same turn twice at once on one SDK session; test_proto_config.py reads
// both ceilings against it and still takes the LARGER, so raising the export again
// without raising this literal reds that test rather than corrupting a run.
// The cost: a POST abandoned by a shim killed mid-flight reappears after 2100 s. A whole
// run now spans several messages-worth of attempts, which is the resume path working,
// not a failure. There is deliberately NO redrive policy:
// ChangeMessageVisibility never resets the receive count, so any maxReceiveCount sized
// on "a few forced checkpoints" would dead-letter a legitimately long turn. A message
// that fails on every delivery retries forever with back-off — visible, and acceptable
// at n=1.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

queues {
  turns {
    defaultVisibilityTimeout = 2100 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    fifo = false
  }
  // U5: where the shim moves a message past SQSD_MAX_RETRIES under docker-compose.sqsd.yml
  // (a SendMessage then a DeleteMessage from `turns`). A plain queue: no redrive on either
  // side, so the limit is the one variable the shim and the worker both read, not a
  // maxReceiveCount fixed in this file. Nothing consumes it; the worker's close covers the turn.
  turns-dlq {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    fifo = false
  }
}
