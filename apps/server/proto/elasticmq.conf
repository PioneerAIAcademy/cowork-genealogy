// elasticmq for the D3 prototype (docs/plan/search-agent-prototype.md, "Week 1" D3).
// One queue, `turns`. Visibility timeout sits ABOVE the 1800 s step ceiling the shim
// enforces, and there is deliberately NO redrive policy: ChangeMessageVisibility never
// resets the receive count, so any maxReceiveCount sized on "a few forced checkpoints"
// would dead-letter a legitimately long turn. A message that fails on every delivery
// retries forever with back-off — visible, and acceptable at n=1.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

queues {
  turns {
    defaultVisibilityTimeout = 2100 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    fifo = false
  }
}
