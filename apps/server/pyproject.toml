[project]
name = "genealogy-workbench-server"
version = "0.0.0"
description = "FastAPI control plane for the hosted genealogy workbench (POC)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "sqlmodel>=0.0.39",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "websockets>=13",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.14.2",
    "claude-agent-sdk>=0.2.128",
    "e2b>=2.35.0",
    # Postgres driver (Neon on Fly); SQLite remains the local default. The
    # [binary] extra bundles libpq → no Dockerfile/apt change on python:3.12-slim.
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "anyio>=4.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
# Copy instead of hardlink when materialising packages into .venv. OneDrive
# rejects uv's default hardlinking ("os error 396"), and a partially-synced
# dist-info then surfaces as an intermittent "Access is denied" (os error 5) on
# the next `uv run` — which reads like a stray file lock and gets retried away.
# Full write-up in eval/harness/uv.toml. Costs nothing off OneDrive.
link-mode = "copy"
